name: Build unsigned IPA

on:
  push:
    branches: [main, codex/fix-reminder-lifecycle]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits the Xcode 16 project format, so the runner's default
      # Xcode is not necessarily new enough to open it.
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DutyPing.xcodeproj \
            -scheme DutyPing \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select available iPhone simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Test scheduling, completion, snooze, and Arabic parsing
        run: |
          xcodebuild \
            -project DutyPing.xcodeproj \
            -scheme DutyPing \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DutyPing-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DutyPing.app Payload/
          zip -qry DutyPing.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DutyPing-ipa
          path: DutyPing.ipa
          if-no-files-found: error
